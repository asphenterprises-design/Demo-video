padding:0;

body{
background:#000;

text-align:center;
}

.container{
width:95%;
max-width:800px;
margin:auto;

h1{
font-size:40px;
color:#ff00ff;
margin-bottom:15px;

}

.demo-image{
margin-bottom:25px;

.demo-image img{
width:100%;
border-radius:15px;
border:2px solid #ff00ff;
box-shadow:0 0 20px rgba(255,0,255,.4);
}

.buy-btn{
display:inline-block;
margin:40px 0;
padding:20px 45px;
font-size:28px;
font-weight:bold;
text-decoration:none;
color:white;
border-radius:100px;

background:linear-gradient(
45deg,
#ff0000,
#ff6600,
#ffcc00,
#ff6600
);

background-size:300% 300%;

animation:
gradientMove 3s ease infinite,
pulse 1.2s infinite;

box-shadow:
0 0 15px #ff6600,
0 0 30px #ff6600,
0 0 60px #ff6600;
}

.buy-btn del{
color:#ddd;
margin-right:8px;
}

@keyframes gradientMove{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

@keyframes pulse{
0%{transform:scale(1);}
50%{transform:scale(1.08);}
100%{transform:scale(1);}
}

.secure-box{
background:#111;
padding:20px;
border-radius:15px;
margin-bottom:30px;
}

.secure-box h3{
color:#00ff66;
margin-bottom:10px;
}
