<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#000;
color:#fff;
padding-bottom:100px;
}

h1{
text-align:center;
padding:20px;
color:#ff00ff;
}

.gallery{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:12px;
padding:15px;
max-width:900px;
margin:auto;
}

.gallery img{
width:100%;
border-radius:12px;
border:2px solid #ff00ff;
display:block;
}

.fixed-btn{
position:fixed;
bottom:0;
left:0;
width:100%;
padding:15px;
background:#111;
box-shadow:0 -5px 20px rgba(0,0,0,.5);
z-index:9999;
text-align:center;
}

.buy-btn{
display:inline-block;
width:95%;
max-width:500px;
padding:18px;
font-size:24px;
font-weight:bold;
text-decoration:none;
color:#fff;
border-radius:50px;

background:linear-gradient(
45deg,
#ff0000,
#ff6600,
#ffcc00,
#ff6600
);

background-size:300% 300%;

animation:
gradientMove 3s infinite,
pulse 1.2s infinite;
}

.buy-btn del{
color:#ddd;
}

@keyframes gradientMove{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

@keyframes pulse{
0%{transform:scale(1);}
50%{transform:scale(1.05);}
100%{transform:scale(1);}
}

@media(max-width:600px){
.gallery{
grid-template-columns:repeat(2,1fr);
}
.buy-btn{
font-size:20px;
}
}

</style>
