<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment Page</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#e9edf2;
padding:20px;
}

.payment-box{
max-width:1000px;
margin:auto;
display:flex;
background:#fff;
border-radius:20px;
overflow:hidden;
box-shadow:0 10px 30px rgba(0,0,0,.15);
}

.left{
width:32%;
background:linear-gradient(180deg,#115842,#012c23);
padding:25px;
color:white;
position:relative;
}

.logo{
width:55px;
height:55px;
border:2px solid rgba(255,255,255,.4);
border-radius:15px;
display:flex;
align-items:center;
justify-content:center;
font-size:26px;
font-weight:bold;
}

.seller{
display:flex;
align-items:center;
gap:15px;
margin-bottom:30px;
}

.seller h2{
font-size:26px;
}

.price-card{
background:rgba(255,255,255,.12);
padding:20px;
border-radius:15px;
margin-bottom:15px;
}

.price-card small{
display:block;
opacity:.8;
}

.price{
font-size:52px;
font-weight:bold;
}

.order{
background:rgba(255,255,255,.12);
padding:14px;
border-radius:10px;
}

.right{
width:68%;
padding:25px;
}

.title{
font-size:28px;
font-weight:bold;
margin-bottom:20px;
}

.qr-section{
display:flex;
gap:25px;
align-items:center;
}

.qr{
width:260px;
height:260px;
border:1px solid #ddd;
padding:10px;
}

.qr img{
width:100%;
height:100%;
object-fit:cover;
}

.info{
flex:1;
}

.info h3{
font-size:30px;
margin-bottom:15px;
}

.apps{
display:flex;
gap:10px;
margin-top:20px;
}

.app{
background:#f3f3f3;
padding:10px 15px;
border-radius:10px;
font-weight:bold;
}

.note{
margin-top:25px;
font-size:20px;
line-height:1.7;
color:#555;
}

.pay-btn{
display:block;
margin-top:30px;
background:#16a34a;
color:white;
text-decoration:none;
text-align:center;
padding:18px;
border-radius:12px;
font-size:24px;
font-weight:bold;
}

@media(max-width:768px){

.payment-box{
flex-direction:column;
}

.left,.right{
width:100%;
}

.qr-section{
flex-direction:column;
}

.qr{
width:220px;
height:220px;
}

}

</style>
</head>
<body>

<div class="payment-box">

<div class="left">

<div class="seller">
<div class="logo">TR</div>
<h2>TRUSTED SELLER</h2>
</div>

<div class="price-card">
<small>Price Summary</small>
<div class="price">₹295</div>
</div>

<div class="order">
Order ID : ORD123456789
</div>

</div>

<div class="right">

<div class="title">
Payment Options
</div>

<div class="qr-section">

<div class="qr">
<img src="https://ik.imagekit.io/q3emnf9bso/WhatsApp%20Image%202026-06-11%20at%201.19.11%20AM.jpeg" alt="QR">
</div>

<div class="info">

<h3>Scan Using Any UPI App</h3>

<div class="apps">

<a href="upi://pay?pa=yourupi@paytm&pn=TrustedSeller&am=295" class="app">
<img src="https://upload.wikimedia.org/wikipedia/commons/thumb/5/55/Paytm_logo.png/320px-Paytm_logo.png">
</a>

<a href="upi://pay?pa=yourupi@ybl&pn=TrustedSeller&am=295" class="app">
<img src="https://upload.wikimedia.org/wikipedia/commons/thumb/7/71/PhonePe_Logo.svg/512px-PhonePe_Logo.svg.png">
</a>

<a href="upi://pay?pa=yourupi@okaxis&pn=TrustedSeller&am=295" class="app">
<img src="https://upload.wikimedia.org/wikipedia/commons/thumb/7/7b/Google_Pay_Logo.svg/512px-Google_Pay_Logo.svg.png">
</a>

</div>

<div class="note">
Take a screenshot of this QR code and scan it using any UPI app.
</div>

<a href="#" class="pay-btn">
I HAVE PAID ₹295
</a>

</div>

</div>

</div>

</div>

</body>
</html>
